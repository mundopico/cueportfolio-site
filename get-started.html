<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get started — Cue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0F0F12;
    --bg-surface: #16161A;
    --bg-elevated: #1E1E24;
    --bg-border: #2A2A36;
    --bg-border-subtle: #222230;
    --accent: #E8A030;
    --accent-hover: #D4911A;
    --accent-dim: rgba(232,160,48,0.12);
    --text-primary: #F4F4F6;
    --text-secondary: #9898A8;
    --text-muted: #55556A;
    --radius-md: 10px; --radius-lg: 16px;
    --shadow-elevated: 0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'DM Sans', -apple-system, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .serif { font-family: 'DM Serif Display', serif; font-weight: 400; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 32px; }
  a { color: inherit; text-decoration: none; }

  nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(15,15,18,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--bg-border-subtle);
  }
  nav .nav-wrap { max-width: 880px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 108px; }
  .logo-block { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .wordmark-text {
    font-family: 'Century Gothic', 'Futura', 'Avenir Next', sans-serif;
    font-weight: 800; font-size: 24px; letter-spacing: 0.2px; color: var(--text-primary);
  }
  .nav-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; color: var(--accent);
    background: var(--accent-dim); border: 1px solid rgba(232,160,48,0.3);
    border-radius: 20px; padding: 3px 11px; margin-left: 1px;
  }
  .nav-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .back-link { font-size: 13.5px; color: var(--text-secondary); }
  .back-link:hover { color: var(--text-primary); }

  main { padding: 64px 0 100px; }

  .panel-head { text-align: center; margin-bottom: 44px; }
  .panel-head h1 { font-size: 30px; margin-bottom: 10px; }
  .panel-head p { font-size: 14.5px; color: var(--text-secondary); max-width: 480px; margin: 0 auto; }

  .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .tier-card {
    background: var(--bg-surface); border: 1px solid var(--bg-border); border-radius: var(--radius-lg);
    padding: 28px 24px; display: flex; flex-direction: column; position: relative; text-align: left;
    cursor: pointer; transition: border-color .15s, transform .15s; font: inherit; color: inherit;
  }
  .tier-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tier-card.featured { border-color: var(--accent); background: var(--bg-elevated); box-shadow: var(--shadow-elevated); }
  .tier-badge {
    position: absolute; top: -12px; left: 24px;
    background: var(--accent); color: #14100a; font-size: 10.5px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; padding: 4px 12px; border-radius: 20px; white-space: nowrap;
  }
  .tier-name { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; }
  .tier-card.featured .tier-name { color: var(--accent); }
  .tier-tagline { font-size: 18px; font-weight: 700; margin-bottom: 6px; font-family: 'DM Sans', sans-serif; }
  .tier-price { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .tier-features { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; flex: 1; }
  .tier-features li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
  .feat-icon { flex-shrink: 0; margin-top: 3px; }
  .tier-cta {
    width: 100%; padding: 11px 16px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 600;
    text-align: center; border: 1px solid var(--bg-border); background: transparent; color: var(--text-primary);
  }
  .tier-card.featured .tier-cta { background: var(--accent); color: #14100a; border-color: var(--accent); }
  .tier-card:hover .tier-cta { border-color: var(--accent); color: var(--accent); }
  .tier-card.featured:hover .tier-cta { color: #14100a; background: var(--accent-hover); }

  .redirect-panel { text-align: center; max-width: 440px; margin: 0 auto; }
  .redirect-panel p { font-size: 14.5px; color: var(--text-secondary); margin-top: 8px; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 20px;
    border: 3px solid var(--bg-border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .tier-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-wrap">
    <div class="logo-block">
      <a class='logo' href='/'>
        <svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <polygon points="78,50 38,28 38,72" fill="#F2B655"/>
          <circle cx="20" cy="50" r="9" fill="#F2B655"/>
        </svg>
        <span class="wordmark-text">Cue</span>
      </a>
      <div class="nav-badge"><span class="dot"></span>AI Portfolio Strategist</div>
    </div>
    <a class='back-link' href='/'>← Back to site</a>
  </div>
</nav>

<main>
  <div class="wrap">

    <!-- Tier choice — shown unless ?tier= already picks one -->
    <section id="panel-tier">
      <div class="panel-head">
        <h1 class="serif">Choose how you want to use Cue.</h1>
        <p>No brokerage login, either way. You'll create your account on the next step.</p>
      </div>
      <div class="tier-grid">
        <button class="tier-card" onclick="goToApp('market_data')">
          <div class="tier-name">Market Data</div>
          <div class="tier-tagline">Browse the market</div>
          <ul class="tier-features">
            <li><svg class="feat-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Search any ticker for institutional-grade research</li>
            <li><svg class="feat-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Cue's daily pick, in plain English</li>
            <li><svg class="feat-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> No account connection required</li>
          </ul>
          <div class="tier-cta">Continue with Market Data</div>
        </button>
        <button class="tier-card featured" onclick="goToApp('portfolio_optimizer')">
          <div class="tier-badge">Most popular</div>
          <div class="tier-name">Portfolio Optimizer</div>
          <div class="tier-tagline">Get a full read on your holdings</div>
          <ul class="tier-features">
            <li><svg class="feat-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Upload via CSV, Excel, or a photo — no brokerage login</li>
            <li><svg class="feat-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Sector allocation, overlap &amp; diversification score</li>
            <li><svg class="feat-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Tailored buy/sell recommendations</li>
          </ul>
          <div class="tier-cta">Continue with Portfolio Optimizer</div>
        </button>
      </div>
    </section>

    <!-- Shown briefly when ?tier= is already in the URL (from a pricing card) -->
    <section id="panel-redirect" style="display:none;">
      <div class="redirect-panel">
        <div class="spinner"></div>
        <h1 class="serif" id="redirect-title">Taking you to sign up…</h1>
        <p>Create your account, accept the beta agreement, and you're in.</p>
      </div>
    </section>

  </div>
</main>

<script>
  // The real signup, beta agreement, and tier-specific setup (including CSV/
  // Excel/photo upload) all live in the actual product at app.cueportfolio.com
  // — this page's only job is letting a visitor pick a tier before handing
  // off. Duplicating that flow here as static-site JS would mean a second,
  // divergent copy of security-sensitive logic (auth, file upload) with no
  // way to keep it in sync with the real backend.
  var APP_URL = 'https://app.cueportfolio.com/app';

  function goToApp(tier) {
    window.location.href = APP_URL + '?tier=' + encodeURIComponent(tier);
  }

  (function () {
    var params = new URLSearchParams(window.location.search);
    var tier = params.get('tier');
    if (tier === 'market_data' || tier === 'portfolio_optimizer') {
      document.getElementById('panel-tier').style.display = 'none';
      document.getElementById('panel-redirect').style.display = 'block';
      document.getElementById('redirect-title').textContent =
        'Setting up ' + (tier === 'portfolio_optimizer' ? 'Portfolio Optimizer' : 'Market Data') + '…';
      setTimeout(function () { goToApp(tier); }, 600);
    }
  })();
</script>

</body>
</html>
